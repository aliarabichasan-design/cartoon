<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفاصيل الكارتون والتكاليف</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --border:#dfe3ea; --head:#2f5aa8; --headtxt:#fff;
  --text:#1c2333; --accent:#2f5aa8; --muted:#8a93a6; --ok:#2e8b57; --err:#c0392b;
  --mark-bg:#ffe08a; --mark-txt:#1c2333;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --card:#1d2029; --border:#333846; --head:#3a63b0; --headtxt:#fff;
    --text:#e7e9ee; --muted:#8c93a3; --accent:#5b8ae0; --ok:#4caf7d; --err:#e06c5e;
    --mark-bg:#7a5c00; --mark-txt:#fff;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --card:#1d2029; --border:#333846; --head:#3a63b0; --headtxt:#fff;
  --text:#e7e9ee; --muted:#8c93a3; --accent:#5b8ae0; --ok:#4caf7d; --err:#e06c5e;
  --mark-bg:#7a5c00; --mark-txt:#fff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Segoe UI","Tahoma",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
button{
  font-family:inherit;font-size:.9rem;border:1px solid var(--border);
  background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;
}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.status{font-size:.8rem;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.err{color:var(--err)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:700px}
th{background:var(--head);color:var(--headtxt);padding:10px 8px;font-size:.85rem;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border);font-size:.9rem;text-align:center}
tr:last-child td{border-bottom:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
#searchBox{
  width:100%;padding:10px 14px;margin-bottom:8px;border:1px solid var(--border);
  border-radius:8px;background:var(--card);color:var(--text);font-family:inherit;font-size:.95rem;
}
#searchBox:focus{outline:2px solid var(--accent);outline-offset:-2px}
.count{font-size:.78rem;color:var(--muted);margin-bottom:10px}
mark{background:var(--mark-bg);color:var(--mark-txt);border-radius:3px;padding:0 2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 تفاصيل الكارتون والتكاليف</h1>
  <p class="sub">يقرأ البيانات مباشرة من ملف Google Sheets — أي تعديل بالشيت ينعكس هنا تلقائياً</p>

  <div class="toolbar">
    <button class="primary" id="refreshBtn">🔄 تحديث الآن</button>
    <span class="status" id="status">جاري التحميل...</span>
  </div>

  <input type="search" id="searchBox" placeholder="🔍 بحث... (CODE، قياس، أي كلمة)" />
  <div class="count" id="countMsg"></div>

  <div class="tablewrap">
    <table id="tbl" style="display:none">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRow"></tbody>
    </table>
    <div class="empty" id="emptyMsg">لا توجد بيانات بعد</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
// رابط CSV المنشور من Google Sheets (File → Share → Publish to web)
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTJQBm-Syhly2MwKYgVSZAI3c_uHQRs4FSyZJv8-oKEf87Adm4f6HdRLf5XUz5b51_0beVms8Mbo-gp/pub?output=csv&cachebust=" + Date.now();

const statusEl = document.getElementById("status");
const tbl = document.getElementById("tbl");
const emptyMsg = document.getElementById("emptyMsg");
const headRow = document.getElementById("headRow");
const bodyRow = document.getElementById("bodyRow");

function setStatus(msg, cls){
  statusEl.textContent = msg;
  statusEl.className = "status " + (cls || "");
}

let allRows = []; // بدون صف العناوين
let headers = [];
const countMsg = document.getElementById("countMsg");
const searchBox = document.getElementById("searchBox");

function highlight(text, q){
  if(!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0,idx) + "<mark>" + text.slice(idx, idx+q.length) + "</mark>" + text.slice(idx+q.length);
}

function renderTable(rows, q){
  if(!rows.length){
    tbl.style.display = "none";
    emptyMsg.style.display = "block";
    emptyMsg.textContent = q ? "لا نتائج مطابقة لـ: " + q : "لا توجد بيانات بعد";
    countMsg.textContent = "";
    return;
  }
  emptyMsg.style.display = "none";
  tbl.style.display = "table";
  bodyRow.innerHTML = "";
  rows.forEach(r=>{
    const tr = document.createElement("tr");
    headers.forEach((_, i)=>{
      const td = document.createElement("td");
      const val = r[i] || "";
      td.innerHTML = q ? highlight(val, q) : val;
      tr.appendChild(td);
    });
    bodyRow.appendChild(tr);
  });
  countMsg.textContent = q ? `${rows.length} نتيجة مطابقة` : `${rows.length} صف`;
}

function applySearch(){
  const q = searchBox.value.trim();
  if(!q){ renderTable(allRows, ""); return; }
  const ql = q.toLowerCase();
  const filtered = allRows.filter(r => r.some(cell => (cell||"").toLowerCase().includes(ql)));
  renderTable(filtered, q);
}

function setData(rows){
  if(!rows.length){ allRows = []; headers = []; renderTable([], ""); return; }
  headers = rows[0];
  headRow.innerHTML = "";
  headers.forEach(h=>{
    const th = document.createElement("th");
    th.textContent = h;
    headRow.appendChild(th);
  });
  allRows = rows.slice(1).filter(r => !r.every(c => !c || !c.trim()));
  applySearch();
}

async function loadData(){
  setStatus("جاري التحديث...");
  try{
    const res = await fetch(CSV_URL, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    const parsed = Papa.parse(text.trim(), {skipEmptyLines:false});
    setData(parsed.data);
    const now = new Date().toLocaleTimeString("ar");
    setStatus("✓ آخر تحديث: " + now, "ok");
  }catch(err){
    setStatus("تعذّر التحديث — تأكد أن الشيت لسه منشور (Publish to web) وأن الرابط صحيح", "err");
  }
}

document.getElementById("refreshBtn").addEventListener("click", loadData);
searchBox.addEventListener("input", applySearch);

loadData();
setInterval(loadData, 30000); // تحديث تلقائي كل 30 ثانية
</script>
</body>
</html>
