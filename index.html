<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفاصيل الكارتون والتكاليف</title>
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --border:#dfe3ea; --head:#2f5aa8; --headtxt:#fff;
  --text:#1c2333; --accent:#2f5aa8; --danger:#c0392b; --muted:#8a93a6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --card:#1d2029; --border:#333846; --head:#3a63b0; --headtxt:#fff;
    --text:#e7e9ee; --accent:#5b8ae0; --danger:#e06c5e; --muted:#8c93a3;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --card:#1d2029; --border:#333846; --head:#3a63b0; --headtxt:#fff;
  --text:#e7e9ee; --accent:#5b8ae0; --danger:#e06c5e; --muted:#8c93a3;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Segoe UI","Tahoma",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{
  font-family:inherit;font-size:.9rem;border:1px solid var(--border);
  background:var(--card);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;
}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.danger{color:var(--danger)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:700px}
th{
  background:var(--head);color:var(--headtxt);padding:10px 8px;font-size:.85rem;
  position:sticky;top:0;white-space:nowrap;
}
td{padding:0;border-bottom:1px solid var(--border);border-inline-start:1px solid var(--border)}
td input{
  width:100%;border:none;background:transparent;color:var(--text);padding:9px 8px;
  font-family:inherit;font-size:.9rem;text-align:center;
}
td input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:rgba(91,138,224,.08)}
.rowcode input{font-weight:600}
.delcol{width:40px;text-align:center}
.delcol button{padding:4px 8px;font-size:.8rem}
.status{margin-top:10px;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 تفاصيل الكارتون والتكاليف</h1>
  <p class="sub">التعديلات تُحفظ تلقائياً في هذا المتصفح</p>

  <div class="toolbar">
    <button class="primary" id="addRow">+ إضافة صف</button>
    <button id="exportCsv">تصدير CSV</button>
    <button class="danger" id="resetAll">تفريغ الكل</button>
  </div>

  <div class="tablewrap">
    <table id="tbl">
      <thead>
        <tr>
          <th>CODE</th>
          <th>القياس الأول</th>
          <th>عدد المطبوع</th>
          <th>القياس الثاني</th>
          <th>عدد المطبوع</th>
          <th>سلفان وجهين</th>
          <th class="delcol"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
const COLS = ["code","size1","count1","size2","count2","selophane"];
const DEFAULT = [
  {code:"A003", size1:"70*100", count1:"4 علبة تنزل", size2:"", count2:"", selophane:""},
  {code:"A005", size1:"70*70", count1:"1", size2:"", count2:"", selophane:""},
  {code:"A006", size1:"100*70 قبغ", count1:"6", size2:"100*55 قاعدة", count2:"تنزل 2", selophane:""},
];
const KEY = "carton_data_v1";
let rows = [];

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    rows = raw ? JSON.parse(raw) : DEFAULT.map(r=>({...r}));
  }catch(e){ rows = DEFAULT.map(r=>({...r})); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(rows)); setStatus("تم الحفظ ✓"); }
  catch(e){ setStatus("تعذّر الحفظ"); }
}
function setStatus(msg){
  const el = document.getElementById("status");
  el.textContent = msg;
  clearTimeout(setStatus._t);
  setStatus._t = setTimeout(()=>{el.textContent="";}, 1500);
}

function render(){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  rows.forEach((row, idx)=>{
    const tr = document.createElement("tr");
    COLS.forEach(col=>{
      const td = document.createElement("td");
      if(col==="code") td.className="rowcode";
      const input = document.createElement("input");
      input.value = row[col] || "";
      input.addEventListener("input", e=>{
        rows[idx][col] = e.target.value;
        save();
      });
      td.appendChild(input);
      tr.appendChild(td);
    });
    const delTd = document.createElement("td");
    delTd.className = "delcol";
    const delBtn = document.createElement("button");
    delBtn.textContent = "✕";
    delBtn.title = "حذف الصف";
    delBtn.addEventListener("click", ()=>{
      rows.splice(idx,1);
      save(); render();
    });
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  });
}

document.getElementById("addRow").addEventListener("click", ()=>{
  rows.push({code:"", size1:"", count1:"", size2:"", count2:"", selophane:""});
  save(); render();
});

document.getElementById("resetAll").addEventListener("click", ()=>{
  if(confirm("متأكد تريد تفريغ كل البيانات؟")){
    rows = [];
    save(); render();
  }
});

document.getElementById("exportCsv").addEventListener("click", ()=>{
  const headers = ["CODE","القياس الاول","عدد المطبوع","القياس الثاني","عدد المطبوع","سلفان وجهين"];
  let csv = "\uFEFF" + headers.join(",") + "\n";
  rows.forEach(r=>{
    csv += COLS.map(c=>`"${(r[c]||"").replace(/"/g,'""')}"`).join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "تفاصيل_الكارتون.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

load();
render();
</script>
</body>
</html>
